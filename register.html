<!doctype html><html lang="ar" dir="rtl"><head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12243a"><title>طلب الانخراط | ملاعب السرغيني</title><link rel="stylesheet" href="style.css"></head><body><div id="siteHeader"></div><main class="wrap"><div class="section-title"><h2>طلب الانخراط وتسجيل الفريق</h2></div><div id="notice" class="notice" hidden></div><form id="registerForm" class="card"><div class="form-grid"><label>الاسم الكامل<input name="name" required></label><label>اسم الفريق<input name="team" required></label><label>رقم الهاتف<input name="phone" type="tel" required></label><label>اسم المستخدم<input name="username" required minlength="3"></label><label>كلمة المرور<input name="password" type="password" required minlength="8"></label><label>تأكيد كلمة المرور<input name="confirmPassword" type="password" required minlength="8"></label><div class="full"><button class="btn">إرسال طلب الانخراط</button></div></div></form><p class="status-note">النسخة التجريبية لا تتحقق من كلمة المرور على خادم. لا تستخدم كلمة مرور حقيقية هنا.</p></main><div id="siteFooter"></div><script src="main.js"></script></body></html>
