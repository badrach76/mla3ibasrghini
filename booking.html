<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#12243a"><title>طلب حجز | ملاعب السرغيني</title><link rel="stylesheet" href="style.css"></head><body><div id="siteHeader"></div><main class="wrap"><div class="section-title"><h2>طلب حجز ملعب</h2><span class="muted">الطلب لا يصبح مؤكدًا إلا بعد موافقة الإدارة</span></div><div id="notice" class="notice" hidden></div><form id="bookingForm" class="card"><div class="form-grid"><label>الملعب<select name="pitch" id="pitch" required><option>ملعب السرغيني 1</option><option>ملعب السرغيني 2</option></select></label><label>نوع الحجز<select name="bookingType" required><option value="مرة واحدة">مرة واحدة</option><option value="شبه دائم">شبه دائم</option><option value="دائم">دائم</option></select></label><label>التاريخ<input id="date" name="date" type="date" required></label><label>وقت البداية<select name="time" required><option value="08:00">08:00</option><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option><option>18:00</option><option>19:00</option><option>20:00</option><option>21:00</option><option>22:00</option><option>23:00</option></select></label><label>مدة الحجز<select name="duration"><option value="60">60 دقيقة</option><option value="90">90 دقيقة</option><option value="120">120 دقيقة</option></select></label><label>اسم الفريق<input name="team" required maxlength="80"></label><label>اسم المسؤول عن الحجز<input name="captain" required maxlength="80"></label><label>رقم الهاتف<input name="phone" type="tel" required maxlength="25" placeholder="06xxxxxxxx"></label><label>عدد اللاعبين<input name="players" type="number" min="1" max="60" value="10"></label><label class="full">ملاحظات<textarea name="notes" maxlength="500" placeholder="أي معلومات إضافية للإدارة"></textarea></label><div class="full"><button class="btn" type="submit">إرسال طلب الحجز</button></div></div></form><p class="status-note">ملاحظة: هذه النسخة تحفظ البيانات في المتصفح الحالي للتجربة فقط، ولا ترسلها إلى الإدارة عبر الإنترنت.</p></main><div id="siteFooter"></div><script src="main.js"></script></body></html>
